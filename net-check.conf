# netcheck.conf — Configuration file for netcheck.sh
# This file is sourced by Bash, so use valid Bash syntax (no spaces around '=').

# -----------------------------------------------------------------------------
# ICMP Ping Targets & Timing
# -----------------------------------------------------------------------------
# Space-separated list of IPs or hosts to ping for external reachability
PING_TARGETS=("1.1.1.1" "9.9.9.9")

# Number of ICMP echo packets sent per target
PING_COUNT=3

# Timeout (in seconds) to wait for each ping response
PING_TIMEOUT=2

# -----------------------------------------------------------------------------
# DNS Lookup & Resolver Benchmark
# -----------------------------------------------------------------------------
# Domain name queried during DNS tests
DNS_DOMAIN="example.com"

# DNS resolvers tested when 'dig' or 'nslookup' is available
DNS_SERVERS=("1.1.1.1" "8.8.8.8" "9.9.9.9")

# -----------------------------------------------------------------------------
# TCP Port & HTTP/HTTPS Endpoint Checks
# -----------------------------------------------------------------------------
# List of "host:port" pairs tested via TCP socket connection
TCP_TARGETS=("1.1.1.1:443" "9.9.9.9:853")

# Full URLs checked using curl (status code + total response time)
HTTP_TARGETS=("https://cloudflare.com" "https://www.google.com")

# -----------------------------------------------------------------------------
# Output & Report Settings
# -----------------------------------------------------------------------------
# 1 = enable ANSI colors in terminal, 0 = plain text
ENABLE_COLOR=1

# 1 = automatically save reports when running non-interactively, 0 = only when --save or menu option 7 is used
SAVE_REPORT=0

# Directory where timestamped .log reports are saved
REPORT_DIR="./reports"
